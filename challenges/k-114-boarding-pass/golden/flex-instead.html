<style>
  body { margin: 0; }
  .stage { height: 300px; display: flex; align-items: center; justify-content: center; background: #1F3A5F; font-family: "Onest", sans-serif; }

  .pass::after { bottom: -10px; }

  .pass:has(.save:focus-visible) .stub { background: #F6E8D0; }
