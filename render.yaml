# Render Blueprint for CSS Dojo. The live services were created in the existing
# "cssdojo" project with these same settings (see docs/guides/render.md).
# Secrets are marked sync: false and are set in the Render dashboard, never here.
services:
  - type: web
    name: cssdojo-api
    runtime: docker
    plan: free
    region: oregon
    branch: feature/mvp
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://cssdojo-api.onrender.com
      - key: CLIENT_URL
        value: https://cssdojo.onrender.com
      - key: RUN_SCORER_IN_PROCESS
        value: "true"
      - key: ENABLE_TEST_LOGIN
        value: "false"
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: cssdojo
    runtime: static
    branch: feature/mvp
    autoDeploy: true
    buildCommand: curl -fsSL https://bun.sh/install | bash -s bun-v1.4.4 && ~/.bun/bin/bun install --frozen-lockfile && ~/.bun/bin/bun run --filter @cssdojo/client build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://cssdojo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
