<!doctype html><html><head><style>/* fonts are inlined at render time by client/scripts/brand.ts */
*{box-sizing:border-box;margin:0}body{width:1200px;height:630px;background:#0C0D10;color:#ECEAE4;font-family:Onest,sans-serif;display:grid;grid-template-columns:1fr 420px;gap:56px;padding:72px 80px;align-items:center;overflow:hidden}
.word{display:flex;align-items:center;gap:16px;font:600 30px/1 "Martian Mono",monospace;letter-spacing:-.02em}.word .css{color:#6B6F79}
