# Full local stack: Postgres + the app (API, scorer worker, client).
#   docker compose up --build   then open http://localhost:8787
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: dojo
      POSTGRES_DB: cssdojo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo -d cssdojo"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://dojo:dojo@db:5432/cssdojo
      API_URL: http://localhost:8787
      CLIENT_URL: http://localhost:8787
      BETTER_AUTH_SECRET: local-dev-secret-change-me-please
      ENABLE_TEST_LOGIN: "true"
      RUN_SCORER_IN_PROCESS: "true"
      NODE_ENV: production
    ports: ["8787:8787"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
